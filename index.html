<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRUIT_NINJA</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="wrapper">
        <div class="gamecontainer">
            <div class="header">
                <div class="scorediv">
                    <h2>SCORE</h2>
                    <h1 id="strScore">0</h1>
                </div>
                <div class="gameheading">
                    <h1>FRUIT NINJA</h1>
                </div>
                <div class="livesdiv">
                    <h2>LIVES</h2>
                    <h1 id="strLife">5</h1>
                </div>
            </div>

            <canvas id="canvas" width="800" height="600">
            </canvas>
            <img src="assets/apple.png" class="fruitImg" alt="">
            <img src="assets/banana.png" class="fruitImg" alt="">
            <img src="assets/fresh-pineapple-captured-on-a-transparent-background-showcasing-its-vibrant-color.png" class="fruitImg" alt="">
            <img src="assets/guava.png" class="fruitImg" alt="">
            <img src="assets/orange.png" class="fruitImg" alt="">
            <img src="assets/pomegranate.png" class="fruitImg" alt="">
            <img src="assets/watermelon.png" class="fruitImg" alt="">
            
            <!-- <button class="playbtn">PLAY</button> -->

        </div>

    </div>

    <script src="index.js"></script>
</body>

</html>
