<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRUIT_NINJA</title>
    <link rel="icon"
        href="https://imgs.search.brave.com/_vvSoRIFwKYL19RlQevKkt0_XXWStClZTUW2_QhYuL8/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly90aHVt/Ym5haWwuaW1nYmlu/LmNvbS8yMy8yMS8y/Mi9pbWdiaW4tZnJ1/aXQtbmluamEtd2hl/cmUtcy1teS13YXRl/ci1vdGhlcnMtR0RL/bTBBUDA2ZlZaMzdT/UXczYjNNelR6bV90/LmpwZw" />

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="wrapper">
        <div class="gamecontainer">
            <div class="header">
                <div class="scorediv">
                    <h2>SCORE</h2>
                    <h1 id="strScore">0</h1>
                </div>
                <div class="gameheading">
                    <h1>FRUIT NINJA</h1>
                </div>
                <div class="livesdiv">
                    <h2>LIVES</h2>
                    <h1 id="strLife">5</h1>
                </div>
            </div>

            <canvas id="canvas" width="800" height="600">
            </canvas>
            <div id="uiScreen" class="uiscreen">
                <div id="startMenu" class="menu">
                    <h1>FRUIT NINJA</h1>
                    <div class="modeButtons">
            <button id="normalBtn" class="action_btn selected">NORMAL MODE</button>
            <button id="advanceBtn" class="action_btn ">ADVANCE MODE</button>
        </div>
                    <button id="startBtn" class="action_btn">PLAY</button>
                </div>
                <div id="gameOverMenu" class="menu hidden">
                    <h1>GAME OVER</h1>
                    <h2 id="finalScore">Score: 0</h2>
                    <button id="restartBtn" class="action_btn">RESTART</button>
                </div>
                <img src="assets/apple.png" class="fruitImg" alt="">
                <img src="assets/banana.png" class="fruitImg" alt="">
                <img src="assets/fresh-pineapple-captured-on-a-transparent-background-showcasing-its-vibrant-color.png"
                    class="fruitImg" alt="">
                <img src="assets/guava.png" class="fruitImg" alt="">
                <img src="assets/orange.png" class="fruitImg" alt="">
                <img src="assets/pomegranate.png" class="fruitImg" alt="">
                <img src="assets/watermelon.png" class="fruitImg" alt="">


            </div>

        </div>

        <script src="index.js"></script>
</body>

</html>
